[project]
name = "moderation-service"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Dodgemaster1", email = "mykyta.manaiev@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "aiolimiter>=1.3.0",
    "alembic>=1.20.1",
    "fastapi>=0.162.0",
    "httpx>=0.28.1",
    "psycopg[binary]>=3.3.8",
    "pydantic-settings>=2.12.0",
    "sqlalchemy[asyncio]>=2.0.46",
    "uvicorn>=0.54.0",
]

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-randomly>=5.0.0",
    "pytest-sugar>=1.1.1",
    "ruff>=0.17.4",
    "ty>=0.0.99",
]

[tool.ruff]
line-length = 120
preview = true

[tool.ruff.lint.per-file-ignores]
"tests/*" = [
    "assert",
    "any-type",
    "magic-value-comparison",
    "unused-function-argument",
    "D",
]
"comments/migrations/*" = ["undocumented-public-class", "mutable-class-default"]
"comments/models.py" = ["django-nullable-model-string-field"]

[tool.ruff.lint]
extend-select = ["ALL"]
ignore = [
    "undocumented-public-init",
    "undocumented-public-module",
    "undocumented-public-package",
    "incorrect-blank-line-before-class",
    "multi-line-summary-first-line",
    "CPY",
    "TC",
    "T20",
    "ERA",
    "DOC",
    "D",
    "any-type",
    "blind-except",
    "missing-trailing-comma", # warning
    "no-self-use", # static-method
    "future-rewritable-type-annotation",
    "ambiguous-unicode-character-string",
    "raise-vanilla-args",
    "try-except-in-loop",
    "unaliased-collections-abc-set-import",
    "try-consider-else",
    "if-else-block-instead-of-if-exp",
    "raw-string-in-exception",
    "explicit-string-concatenation",
]
